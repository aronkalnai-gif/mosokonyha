<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mosókonyha</title>
    <meta name="description" content="Szabad mosókonyha-kulcsok a kollégiumban, élőben." />
    <meta name="theme-color" content="#F6F4F0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mosókonyha" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #ebe7e0;
        -webkit-font-smoothing: antialiased;
      }
      /* One typeface everywhere (react-native-web sets its own font on each text). */
      #root,
      #root *,
      body > div * {
        font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif !important;
      }
      /* Phone-width column, also on desktop. */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        max-width: 560px;
        margin: 0 auto;
        background: #f6f4f0;
      }
    </style>
  </head>
  <body>
    <noscript>Az oldal használatához engedélyezd a JavaScriptet. / Please enable JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
